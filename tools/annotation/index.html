<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionLint 独立标注</title><link rel="icon" href="data:,">
<style>body{margin:24px auto;max-width:1100px;background:#f3f5f8;color:#17283c;font:16px system-ui}section{background:white;border-radius:12px;padding:20px;margin:16px 0}h1{font-size:26px}canvas{width:100%;background:#eef2f8;border:1px solid #ccd4df}label{display:inline-block;margin:8px}input,select,button{padding:8px;font:inherit}button{cursor:pointer}#scrub{width:70%}.row{display:flex;gap:16px}.row>div{flex:1}small{color:#526176}#events div{border-bottom:1px solid #ccc;padding:10px}#message{color:#a22}#prompt{white-space:pre-wrap}</style>
<h1>独立动作标注</h1><p>仅查看原始骨架，不显示检测告警。请两位标注者分别完成，再由复核者处理分歧。</p>
<section><label>加载 clips.json <input id="file" type="file" accept=".json"></label><label>标注者代号 <input id="author" placeholder="例如 A，避免填写身份信息"></label><button id="export">导出标注 JSON</button><label>继续自己的标注 <input id="resume" type="file" accept=".json"></label><p id="message"></p><small>离开前请导出文件；重新打开后加载动作及自己导出的标注。不要导入另一位同学的文件。</small></section>
<section><select id="clip"></select><p id="prompt"></p><small id="info"></small><div class="row"><div><p>正面</p><canvas id="front" width="520" height="420"></canvas></div><div><p>侧面</p><canvas id="side" width="520" height="420"></canvas></div></div>
<p><button id="play">播放/暂停</button><input id="scrub" type="range" min="0" value="0"><span id="frame"></span></p>
<label>起始帧 <input id="start" type="number" min="0" value="0"></label><button id="markStart">用当前帧</button><label>结束帧 <input id="end" type="number" min="0" value="0"></label><button id="markEnd">用当前帧</button>
<p><label>类型 <select id="type"><option value="temporal_continuity">连续性突变</option><option value="skeleton_integrity">骨架形变</option><option value="foot_sliding">支撑脚滑动</option><option value="ground_contact">地面接触异常</option><option value="collision">骨架近距风险（非网格穿透）</option><option value="motion_jerk">抖动/jerk</option></select></label><label>人物 <select id="actor"></select></label><label>关节编号 <input id="joints" placeholder="如 7,10"></label></p>
<p><label><input id="uncertain" type="checkbox">无法确认</label><label><input id="expected" type="checkbox">预期接触（握手/击掌等）</label><label>备注 <input id="note"></label><button id="add">添加区间</button></p><div id="events"></div>
<p><label>提示词/音乐对应语义 <select id="semantic"><option value="">尚未判断</option><option value="yes">符合</option><option value="partial">部分符合</option><option value="no">不符合</option><option value="uncertain">无法判断</option></select></label><button id="complete">确认此动作已完整看过并标注</button></p><small>无异常也需点击确认。两幅视图来自相同关节，不提供蒙皮穿透真值。</small></section>
<script>
const $=id=>document.getElementById(id);let data=null,index=0,time=0,playing=false,last=0,records=[];const bounds=new WeakMap();
const current=()=>data?.clips[index];const record=()=>records[index];
const fail=message=>$('message').textContent=message;
function draw(id,horizontal){const c=$(id),ctx=c.getContext('2d'),clip=current();ctx.clearRect(0,0,c.width,c.height);if(!clip)return;if(!bounds.has(clip)){const lo=[-1,0,-1],hi=[1,2,1];for(const frame of clip.positions)for(const actor of frame)for(const p of actor)for(let a=0;a<3;a++){lo[a]=Math.min(lo[a],p[a]);hi[a]=Math.max(hi[a],p[a])}bounds.set(clip,{lo,hi})}const {lo,hi}=bounds.get(clip),min=lo[horizontal],max=hi[horizontal],low=lo[1],high=hi[1];const scale=Math.min((c.width-50)/(max-min),(c.height-45)/(high-low)), x=p=>25+(p[horizontal]-min)*scale,y=p=>c.height-20-(p[1]-low)*scale;ctx.strokeStyle='#bdc7d3';ctx.beginPath();ctx.moveTo(0,y([0,0,0]));ctx.lineTo(c.width,y([0,0,0]));ctx.stroke();clip.positions[Math.floor(time)].forEach((points,a)=>{ctx.strokeStyle=a?'#b45224':'#235dab';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=3;points.forEach((p,j)=>{if(clip.parents[j]>=0){ctx.beginPath();ctx.moveTo(x(points[clip.parents[j]]),y(points[clip.parents[j]]));ctx.lineTo(x(p),y(p));ctx.stroke();}ctx.beginPath();ctx.arc(x(p),y(p),3,0,7);ctx.fill();});});}
function render(){draw('front',0);draw('side',2);const c=current();if(c){$('scrub').value=Math.floor(time);$('frame').textContent=`帧 ${Math.floor(time)} / ${c.frame_count-1} · ${(time/c.fps).toFixed(2)}s`;}}
function refresh(){const r=record();$('events').replaceChildren();if(!r)return;for(const [i,e]of r.events.entries()){const div=document.createElement('div');div.textContent=`${e.test_name} · 人物 ${e.actor_id+1} · ${e.start_frame}–${e.end_frame} · ${e.uncertain?'不确定 ':''}${e.expected_contact?'预期接触 ':''}${e.note}`;const b=document.createElement('button');b.textContent='删除';b.onclick=()=>{r.events.splice(i,1);r.status='incomplete';refresh()};div.append(b);$('events').append(div)}$('info').textContent=`${current().id} · ${current().fps} FPS · ${r.status} · 关节：${current().joint_names.map((n,i)=>`${i}:${n}`).join(' / ')}`;$('semantic').value=r.semantic_alignment;}
function choose(){index=Number($('clip').value);time=0;playing=false;const c=current();$('scrub').max=c.frame_count-1;$('prompt').textContent=c.prompt;$('actor').replaceChildren();for(let i=0;i<c.actor_count;i++){const option=document.createElement('option');option.value=i;option.textContent=`人物 ${i+1}`;$('actor').append(option)}refresh();render();}
$('file').onchange=async event=>{try{data=JSON.parse(await event.target.files[0].text());if(!Array.isArray(data.clips)||!data.protocol_sha256)throw Error('不是 clips.json');records=data.clips.map(c=>({id:c.id,sha256:c.sha256,fps:c.fps,frame_count:c.frame_count,status:'incomplete',semantic_alignment:'',events:[]}));$('clip').replaceChildren();data.clips.forEach((c,i)=>{const option=document.createElement('option');option.value=i;option.textContent=c.id;$('clip').append(option)});choose();fail('已加载。此页面不自动填写标注。')}catch(e){fail(e.message)}};
$('clip').onchange=choose;$('scrub').oninput=()=>{time=Number($('scrub').value);render()};$('play').onclick=()=>playing=!playing;$('markStart').onclick=()=>$('start').value=Math.floor(time);$('markEnd').onclick=()=>$('end').value=Math.floor(time);
$('resume').onchange=async event=>{try{if(!data)throw Error('请先加载动作 clips.json');const saved=JSON.parse(await event.target.files[0].text());if(saved.protocol_sha256!==data.protocol_sha256||!saved.annotator||!Array.isArray(saved.motions))throw Error('标注协议或文件格式不匹配');if($('author').value.trim()&&$('author').value.trim()!==saved.annotator)throw Error('标注者代号不匹配');const lookup=new Map(saved.motions.map(r=>[r.id,r]));if(lookup.size!==saved.motions.length)throw Error('动作编号重复');const resumed=data.clips.map(c=>{const r=lookup.get(c.id);if(!r||JSON.stringify(r.sha256)!==JSON.stringify(c.sha256)||r.frame_count!==c.frame_count||r.fps!==c.fps||!Array.isArray(r.events))throw Error('动作哈希、帧数或 FPS 不匹配');for(const e of r.events)if(!Number.isInteger(e.start_frame)||!Number.isInteger(e.end_frame)||e.start_frame<0||e.end_frame<e.start_frame||e.end_frame>=c.frame_count||!Number.isInteger(e.actor_id)||e.actor_id<0||e.actor_id>=c.actor_count)throw Error('区间或人物编号错误');return r});records=resumed;$('author').value=saved.annotator;refresh();fail('已恢复自己的标注。')}catch(e){fail(e.message)}};
$('semantic').onchange=()=>{if(record())record().semantic_alignment=$('semantic').value};
$('add').onclick=()=>{if(!current())return;const start=Number($('start').value),end=Number($('end').value),joints=$('joints').value.split(',').filter(x=>x.trim()).map(Number);if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end<start||end>=current().frame_count||joints.some(j=>!Number.isInteger(j)||j<0||j>=current().joint_names.length)){fail('帧区间或关节编号不合法');return}record().events.push({test_name:$('type').value,actor_id:Number($('actor').value),joint_ids:joints,start_frame:start,end_frame:end,uncertain:$('uncertain').checked,expected_contact:$('expected').checked,note:$('note').value});record().status='incomplete';refresh()};
$('complete').onclick=()=>{if(record()){record().status='complete';refresh()}};
$('export').onclick=()=>{if(!data||!$('author').value.trim()){fail('先加载数据并填写标注者代号');return}const result={schema_version:1,annotator:$('author').value.trim(),protocol_sha256:data.protocol_sha256,annotation_basis:'raw_skeleton_front_and_side_no_predictions',exported_utc:new Date().toISOString(),motions:records};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download='annotations-'+$('author').value.replace(/[^a-zA-Z0-9_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function tick(stamp){const c=current();if(playing&&c){time=(time+Math.min(.1,(stamp-last)/1000)*c.fps)%c.frame_count;render()}last=stamp;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
