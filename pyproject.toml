[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionlint"
version = "0.4.0"
description = "Human motion inspection, bounded repair and regression checks"
readme = "docs/MOTIONLINT_QUICKSTART.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7", "upc-pymotion==0.3.4"]

[project.optional-dependencies]
web = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
test = ["pytest>=8,<9"]
build = ["build>=1,<2"]

[project.scripts]
motionlint = "motionlint.cli.main:main"

[tool.setuptools.packages.find]
include = ["motionlint*"]

[tool.setuptools.package-data]
motionlint = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
