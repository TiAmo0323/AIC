name: MotionLint CPU checks
on: [push, pull_request, workflow_dispatch]
jobs:
  portable:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .[test]
      - run: python -m pytest tests/test_motionlint_portable.py -q
      - run: python -m motionlint.benchmark.fixtures demo
      - name: Clean motion quality gate
        run: motionlint check demo/clean_00.npy --output-dir reports/ci-clean
      - name: Detect an injected regression
        run: python scripts/check_motionlint_ci_regression.py demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motionlint-${{ matrix.os }}-${{ matrix.python }}
          path: reports/ci-*
