[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionlint"
version = "0.5.0"
description = "Human motion inspection, bounded repair and regression checks"
readme = "docs/MOTIONLINT_QUICKSTART.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7", "upc-pymotion==0.3.4"]

[project.optional-dependencies]
optimize = ["cvxpy==1.6.5", "clarabel==0.11.1", "scipy==1.15.3"]
competition = ["cvxpy==1.6.5", "clarabel==0.11.1", "scipy==1.15.3", "fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "python-multipart>=0.0.9", "imageio-ffmpeg>=0.6,<1"]
web = ["fastapi>=0.110,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
render = ["imageio-ffmpeg>=0.6,<1"]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]
build = ["build>=1,<2"]

[project.scripts]
motionlint = "motionlint.cli.main:main"

[tool.setuptools.packages.find]
include = ["motionlint*"]

[tool.setuptools]
license-files = ["LICENSE_REVIEW_PENDING.md", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.txt"]

[tool.setuptools.package-data]
motionlint = ["configs/*.yaml", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the external InterGen stack or real CLIP tokenizer"]
